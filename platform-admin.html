<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Catalogue — Platform Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="saas.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#17231f;font:15px Arial}header{background:#173f35;color:white;padding:20px}main{max-width:1000px;margin:auto;padding:14px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:15px;margin:12px 0}input,select,button{width:100%;padding:12px;margin:5px 0;border:1px solid #ccd7ce;border-radius:9px;font:inherit}button{font-weight:bold;background:#e8eee9;color:#173f35}.primary{background:#236653;color:white}.danger{background:#fee2e2;color:#991b1b}.status{padding:10px;background:#e8f3eb;border-radius:8px;overflow-wrap:anywhere}.error{background:#fff0ed;color:#a32d20}.hidden{display:none}.biz{border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hint{color:#66756b;font-size:13px}.alert{font-weight:bold;margin:8px 0}.warning{color:#815300}.expired{color:#991b1b}.ok{color:#166534}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>My Catalogue · Platform Admin</h1><div>Subscriptions and payment tracking</div></header><main><div id="status" class="status">Connecting…</div>
<section id="login" class="card"><h2>Platform owner sign in</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="primary">Sign in</button></section>
<section id="dash" class="card hidden"><button id="refresh">Refresh list</button><button id="signout">Sign out</button><h2>Businesses</h2><div id="counts"></div><input id="search" placeholder="Search company or slug"><div id="list"></div></section></main>
<script>
(()=>{const $=id=>document.getElementById(id);if(!window.MC||!MC.sb){$('status').textContent='Could not connect: saas.js missing.';$('status').className='status error';return}const sb=MC.sb,esc=MC.esc;let data=[],busy=false;function msg(t,e=false){$('status').textContent=t;$('status').className='status'+(e?' error':'')}function show(ok){$('login').classList.toggle('hidden',ok);$('dash').classList.toggle('hidden',!ok)}
function expInfo(date){if(!date)return {text:'Expiry date not set',cls:'ok',days:null};let now=new Date();now.setHours(0,0,0,0);let d=new Date(date+'T00:00:00'),days=Math.round((d-now)/86400000);if(days<0)return{text:'EXPIRED '+(-days)+' day(s) ago',cls:'expired',days};if(days===0)return{text:'EXPIRES TODAY',cls:'expired',days};if(days<=7)return{text:'Expires in '+days+' day(s)',cls:'warning',days};return{text:'Expires '+date,cls:'ok',days}}
function render(){let q=$('search').value.toLowerCase();let a=data.filter(b=>(b.company_name+' '+b.slug+' '+(b.whatsapp||'')).toLowerCase().includes(q));let now=new Date();now.setHours(0,0,0,0);$('counts').textContent='All: '+data.length+' · Published: '+data.filter(b=>b.is_published).length+' · Expired / expiring within 7 days: '+data.filter(b=>{if(!b.subscription_expires_at)return false;return Math.round((new Date(b.subscription_expires_at+'T00:00:00')-now)/86400000)<=7}).length;
$('list').innerHTML=a.map(b=>{let live=!!b.is_published,plan=b.subscription_plan||'trial',pay=b.payment_status||'unpaid',exp=b.subscription_expires_at||'',ex=expInfo(exp),url=location.origin+location.pathname.replace(/platform-admin\.html$/,'index.html')+'?shop='+encodeURIComponent(b.slug);return '<article class="biz" data-id="'+esc(b.id)+'"><h3>'+esc(b.company_name||'Unnamed')+' — '+(live?'Published':'Not published / paused')+'</h3><div class="hint">Slug: '+esc(b.slug)+' · WhatsApp: '+esc(b.whatsapp||'')+'</div><p><b>Subscription:</b> '+esc(plan)+' · <b>Payment:</b> '+esc(pay)+'</p><div class="alert '+ex.cls+'">'+esc(ex.text)+'</div><div class="grid"><button data-pub="'+(!live)+'">'+(live?'Pause catalogue':'Approve & publish')+'</button><button data-preview="'+esc(b.slug)+'">Preview catalogue</button><button data-copy="'+esc(url)+'">Copy link</button></div><hr><h3>Subscription & payment</h3><label>Plan<select data-plan><option value="trial" '+(plan==='trial'?'selected':'')+'>Free Trial</option><option value="monthly" '+(plan==='monthly'?'selected':'')+'>Monthly</option><option value="yearly" '+(plan==='yearly'?'selected':'')+'>Yearly</option></select></label><label>Payment status<select data-pay><option value="unpaid" '+(pay==='unpaid'?'selected':'')+'>Unpaid</option><option value="paid" '+(pay==='paid'?'selected':'')+'>Paid</option><option value="overdue" '+(pay==='overdue'?'selected':'')+'>Overdue</option></select></label><label>Expiry date<input type="date" data-exp value="'+esc(exp)+'"></label><label>Payment notes<input data-note maxlength="500" value="'+esc(b.payment_note||'')+'" placeholder="Payment notes"></label><button class="primary" data-save>Save payment & subscription</button></article>'}).join('')||'<p>No businesses found.</p>'}
async function load(){if(busy)return;busy=true;msg('Checking admin access…');try{let r=await sb.rpc('mc_saas_platform_list_businesses');if(r.error)throw r.error;data=r.data||[];show(true);render();msg('Authorized. '+data.length+' businesses loaded.')}catch(e){show(false);msg('Access denied or setup incomplete. Check platform admin SQL setup. '+e.message,true)}finally{busy=false}}
$('signin').onclick=async()=>{let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){msg(r.error.message,true);return}await load()};$('refresh').onclick=load;$('search').oninput=render;$('signout').onclick=async()=>{await sb.auth.signOut();show(false);msg('Signed out.')};
$('list').onclick=async e=>{let btn=e.target.closest('button');if(!btn)return;let card=btn.closest('.biz'),id=card.dataset.id;if(btn.dataset.preview){window.open('index.html?shop='+encodeURIComponent(btn.dataset.preview),'_blank');return}if(btn.dataset.copy){try{await navigator.clipboard.writeText(btn.dataset.copy);msg('Catalogue link copied.')}catch{msg(btn.dataset.copy)}return}if(btn.dataset.save!==undefined){let args={p_business_id:id,p_subscription_plan:card.querySelector('[data-plan]').value,p_payment_status:card.querySelector('[data-pay]').value,p_subscription_expires_at:card.querySelector('[data-exp]').value||null,p_payment_note:card.querySelector('[data-note]').value};btn.disabled=true;msg('Saving payment and subscription…');let r=await sb.rpc('mc_saas_platform_update_billing',args);btn.disabled=false;if(r.error){msg(r.error.message,true);return}msg('Payment and subscription saved successfully.');await load();return}if(btn.dataset.pub!==undefined){let next=btn.dataset.pub==='true';if(!confirm((next?'Publish':'Pause')+' this catalogue?'))return;let r=await sb.rpc('mc_saas_platform_set_published',{p_business_id:id,p_published:next});if(r.error){msg(r.error.message,true);return}let b=data.find(x=>x.id===id);if(b)b.is_published=next;render();msg('Publication status updated.')}};
sb.auth.getSession().then(r=>r.data.session?load():msg('Sign in with your authorized platform-owner account.'))})();
</script></body></html>

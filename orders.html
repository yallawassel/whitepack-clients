<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Catalogue — Orders</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="saas.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#17231f;font:15px Arial}header{background:#173f35;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:15px}.panel{background:#fff;border:1px solid #dfe7df;border-radius:14px;padding:15px;margin-bottom:13px}h1,h2{margin:0 0 10px}label{display:block;font-weight:bold;font-size:13px;margin:10px 0 5px}input,select{width:100%;padding:11px;border:1px solid #ccd7ce;border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 13px;font-weight:bold;background:#e8eee9;color:#173f35;cursor:pointer}.primary{background:#236653;color:#fff}.danger{background:#fee2e2;color:#991b1b}.hint{font-size:13px;line-height:1.5;color:#68756e}.status{padding:10px;background:#eaf4eb;border-radius:9px;margin:10px 0;white-space:pre-wrap}.err{background:#fff0ed;color:#a32d20}.order{border:1px solid #e1e7e2;border-radius:12px;padding:13px;margin-top:10px}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{padding:5px 8px;background:#e8eee9;border-radius:20px;font-size:12px}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.details div{background:#f7f9f7;padding:9px;border-radius:8px;overflow-wrap:anywhere}.items{white-space:pre-wrap;font-size:13px;line-height:1.5;margin-top:9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f7f9f7;padding:10px;border-radius:10px}.stat b{font-size:22px;display:block}@media(max-width:650px){.grid,.details{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><div style="max-width:1100px;margin:auto"><h1 id="brand">My Catalogue · Orders</h1><div>Private order management</div></div></header><main class="wrap"><section id="login" class="panel"><h2>Staff sign in</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><div class="row"><button class="btn primary" id="signin">Sign in</button><a class="btn" href="admin.html">Business admin</a></div></section><div id="app" hidden><section class="panel"><div class="row"><div style="flex:2"><h2>Order overview</h2><div id="signed" class="hint"></div></div><button class="btn" id="refresh">Refresh</button><button class="btn danger" id="logout">Sign out</button></div><div class="stats"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="new">0</b><span>New</span></div><div class="stat"><b id="delivery">0</b><span>Out for delivery</span></div><div class="stat"><b id="done">0</b><span>Delivered</span></div></div><div id="status" class="status"></div><p class="hint">Automatically refreshes every 10 seconds while this page is open.</p></section><section class="panel"><h2>Find orders</h2><div class="grid"><input id="search" placeholder="Search customer, phone, order…"><select id="statusFilter"><option value="">All statuses</option><option>new</option><option>confirmed</option><option>preparing</option><option>out_for_delivery</option><option>delivered</option><option>cancelled</option></select><select id="paymentFilter"><option value="">All payments</option><option>unpaid</option><option>partial</option><option>paid</option></select></div><div id="orders"></div></section></div></main><script>
(()=>{const {sb,esc,money}=MC;const $=id=>document.getElementById(id);let biz=null,orders=[],timer=null;function msg(t,e=false){$('status').textContent=t;$('status').className='status'+(e?' err':'')}async function init(){const {data}=await sb.auth.getSession();if(!data.session){$('login').hidden=false;$('app').hidden=true;return}$('login').hidden=true;$('app').hidden=false;const m=await sb.from('mc_saas_members').select('business_id').eq('user_id',data.session.user.id).limit(1).maybeSingle();if(m.error||!m.data){msg(m.error?.message||'No business is assigned to this account.',true);return}const b=await sb.from('mc_saas_businesses').select('id,company_name,currency').eq('id',m.data.business_id).maybeSingle();if(b.error||!b.data){msg(b.error?.message||'Business not found.',true);return}biz=b.data;$('brand').textContent=biz.company_name+' · Orders';$('signed').textContent='Signed in as '+data.session.user.email;await load();if(timer)clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)load(true)},10000)}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)alert(r.error.message);else init()};$('logout').onclick=async()=>{if(timer)clearInterval(timer);await sb.auth.signOut();init()};$('refresh').onclick=()=>load();$('search').oninput=render;$('statusFilter').onchange=render;$('paymentFilter').onchange=render;async function load(silent=false){if(!biz)return;const r=await sb.from('mc_saas_orders').select('*').eq('business_id',biz.id).order('created_at',{ascending:false}).limit(500);if(r.error){msg('Could not load orders: '+r.error.message,true);return}orders=r.data||[];render();if(!silent)msg('Orders refreshed.')}function render(){const q=$('search').value.toLowerCase().trim(),st=$('statusFilter').value,ps=$('paymentFilter').value;const shown=orders.filter(o=>(!st||o.order_status===st)&&(!ps||o.payment_status===ps)&&[o.order_number,o.customer_name,o.customer_phone,o.delivery_address].join(' ').toLowerCase().includes(q));$('total').textContent=orders.length;$('new').textContent=orders.filter(o=>o.order_status==='new').length;$('delivery').textContent=orders.filter(o=>o.order_status==='out_for_delivery').length;$('done').textContent=orders.filter(o=>o.order_status==='delivered').length;$('orders').innerHTML=shown.map(o=>{const items=(o.items||[]).map(i=>`${i.quantity||1} × ${i.name} (${i.unit||''}) — ${money(i.line_total??((i.quantity||1)*(i.unit_price||0)),biz.currency)}`).join('\n');const map=o.delivery_lat!=null?`https://www.google.com/maps?q=${o.delivery_lat},${o.delivery_lng}`:(o.delivery_address?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(o.delivery_address):'');return `<article class="order" data-order="${o.id}"><div class="head"><div><b>Order #${esc(o.order_number)}</b><div class="hint">${esc(new Date(o.created_at).toLocaleString())}</div></div><span class="pill">${esc(o.order_status)}</span></div><div class="details"><div><b>Customer</b><br>${esc(o.customer_name)}<br>${esc(o.customer_phone)}</div><div><b>Delivery</b><br>${esc(o.delivery_address||'No address')}<br>${map?`<a href="${esc(map)}" target="_blank" rel="noopener">Open map</a>`:''}</div></div><div class="items">${esc(items||'No items')}${o.notes?'\nNotes: '+esc(o.notes):''}</div><p><b>Total: ${money(o.total,biz.currency)}</b> · Payment: ${esc(o.payment_status)}</p><div class="grid"><select class="order-status">${['new','confirmed','preparing','out_for_delivery','delivered','cancelled'].map(s=>`<option ${o.order_status===s?'selected':''}>${s}</option>`).join('')}</select><select class="payment-status">${['unpaid','partial','paid'].map(s=>`<option ${o.payment_status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn primary save">Save status</button></div><div class="hint saveMsg"></div></article>`}).join('')||'<p class="hint">No orders match.</p>'}$('orders').onclick=async e=>{const b=e.target.closest('.save');if(!b)return;const card=b.closest('[data-order]'),id=card.dataset.order,o=orders.find(x=>x.id===id);b.disabled=true;const r=await sb.from('mc_saas_orders').update({order_status:card.querySelector('.order-status').value,payment_status:card.querySelector('.payment-status').value,updated_at:new Date().toISOString()}).eq('id',id).eq('business_id',biz.id);b.disabled=false;const out=card.querySelector('.saveMsg');if(r.error){out.textContent='Save failed: '+r.error.message;return}o.order_status=card.querySelector('.order-status').value;o.payment_status=card.querySelector('.payment-status').value;out.textContent='Saved.';render()};sb.auth.onAuthStateChange(()=>setTimeout(()=>init(),0));init().catch(e=>msg(e.message,true));})();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:description" content="Where Quality Meets Affordability">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#111827}
header{background:#111827;color:#fff;padding:10px 14px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}
.site-logo{width:58px;height:58px;object-fit:contain;border-radius:50%;background:#fff}

.wrap{max-width:1100px;margin:auto;padding:12px}
h1{margin:0;font-size:24px}.sub{opacity:.75;margin-top:4px;font-size:14px}
.toolbar{position:sticky;top:76px;z-index:15;background:#f5f6f8;padding:8px 0}
.search{width:100%;padding:14px 15px;border:1px solid #ddd;border-radius:14px;font-size:16px;background:#fff;outline:none}
.title{font-size:22px;font-weight:900;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.category{background:#fff;border:0;border-radius:18px;overflow:hidden;padding:0;text-align:left;box-shadow:0 2px 12px #0001}
.category img,.placeholder{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#fff}
.placeholder{display:grid;place-items:center;font-size:42px;background:#e5e7eb}
.info{padding:12px}.name{font-size:17px;font-weight:900}.count{color:#6b7280;font-size:13px;margin-top:4px}
#products{display:none}
.back{border:0;background:#111827;color:#fff;border-radius:12px;padding:11px 15px;font-size:15px;font-weight:700;margin:3px 0 10px}
.product{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px #0001}
.product img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#fff}
.body{padding:12px}.desc{color:#596273;font-size:13px;line-height:1.4;margin-top:5px}.price{font-size:20px;font-weight:900;margin-top:9px}.priceChoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}.priceChoice{border:1px solid #d1d5db;border-radius:10px;background:#fff;color:#111827;padding:9px 6px;font-size:13px;font-weight:800;min-width:0;overflow-wrap:anywhere}.priceChoice.active{background:#111827;color:#fff;border-color:#111827}.priceChoice small{display:block;font-size:15px;margin-top:3px}
.empty{text-align:center;padding:45px 20px;color:#6b7280;background:#fff;border-radius:16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:420px){.site-logo{width:50px;height:50px}h1{font-size:21px}}

/* Shopping cart */
.cartbar{position:fixed;right:16px;bottom:16px;z-index:50;background:#111827;color:#fff;border:0;border-radius:999px;padding:13px 18px;font-size:16px;font-weight:900;box-shadow:0 5px 20px #0003}
.cartbar span{background:#fff;color:#111827;border-radius:999px;padding:2px 7px;margin-left:5px}
.qtyrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.qtybtn{width:38px;height:38px;border:0;border-radius:10px;background:#e5e7eb;font-size:21px;font-weight:900}
.qty{min-width:32px;text-align:center;font-weight:900}
.addbtn{width:100%;margin-top:10px;border:0;border-radius:11px;padding:11px;background:#111827;color:#fff;font-size:15px;font-weight:900}
.cartmodal{display:none;position:fixed;inset:0;background:#0008;z-index:100;padding:18px;align-items:flex-end;justify-content:center}
.cartmodal.open{display:flex}
.cartbox{width:min(650px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}
.carthead{display:flex;justify-content:space-between;align-items:center;font-size:21px;font-weight:900}
.closecart{border:0;background:#e5e7eb;border-radius:10px;padding:8px 12px;font-size:18px}
.cartitem{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.cartitem img{width:64px;height:64px;object-fit:contain;border-radius:10px;background:#f8f8f8}
.cartname{font-weight:800}
.cartprice{font-size:13px;color:#6b7280;margin-top:3px}
.remove{border:0;background:#fee2e2;color:#991b1b;border-radius:8px;padding:7px}
.carttotal{font-size:20px;font-weight:900;text-align:right;margin:15px 0}
.sendwa{width:100%;border:0;border-radius:13px;padding:14px;background:#16a34a;color:#fff;font-size:17px;font-weight:900}
.cartempty{text-align:center;color:#6b7280;padding:30px 10px}

/* Product image zoom */
.zoommodal{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.88);
  align-items:center;
  justify-content:center;
  padding:20px;
  cursor:zoom-out;
}
.zoommodal.open{display:flex}
.zoommodal img{
  max-width:96vw;
  max-height:90vh;
  width:auto;
  height:auto;
  object-fit:contain;
  border-radius:12px;
  box-shadow:0 8px 35px #0008;
}
.closezoom{
  position:absolute;
  top:14px;
  right:16px;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#111827;
  font-size:28px;
  line-height:44px;
  font-weight:900;
  cursor:pointer;
}
.product img{cursor:zoom-in}

/* Delivery checkout */
.checkout{display:grid;gap:10px;margin:16px 0}.checkout label{font-size:14px;font-weight:700}.checkout input,.checkout textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.locationbtn{border:1px solid #111827;background:#fff;border-radius:10px;padding:12px;font-weight:700}.locationhint{font-size:13px;color:#475569}.ordererror{color:#b91c1c;font-size:14px;white-space:pre-wrap}.sendwa:disabled{opacity:.6}


/* WHITE PACK PREMIUM REDESIGN — visual layer only; existing catalogue and order logic preserved */
:root{
  --wp-ink:#17231f;--wp-ink-soft:#31423a;--wp-green:#244d3d;--wp-green-dark:#193a2d;
  --wp-gold:#c8a96b;--wp-paper:#f7f7f3;--wp-line:#e6e8e1;--wp-muted:#6d776f;
  --wp-shadow:0 8px 28px rgba(25,45,35,.07);--wp-shadow-hover:0 16px 36px rgba(25,45,35,.13);
}
html{scroll-behavior:smooth}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--wp-paper);color:var(--wp-ink);-webkit-font-smoothing:antialiased}
header{background:rgba(255,255,255,.96);color:var(--wp-ink);padding:13px 18px;border-bottom:1px solid rgba(35,65,49,.1);box-shadow:0 4px 20px rgba(20,40,30,.035);backdrop-filter:blur(14px)}
header .wrap{padding:4px 0}
.brand{gap:14px}
.site-logo{width:62px;height:62px;border-radius:16px;background:#fff;border:1px solid var(--wp-line);padding:4px;box-shadow:0 3px 12px rgba(20,40,30,.06)}
h1{font-size:25px;letter-spacing:-.8px;font-weight:850;color:var(--wp-green-dark)}
.sub{color:var(--wp-muted);opacity:1;font-size:12px;letter-spacing:1.7px;text-transform:uppercase;margin-top:5px;font-weight:700}
.wrap{max-width:1240px;padding:18px 20px}
.toolbar{top:90px;background:rgba(247,247,243,.94);padding:12px 0 16px;backdrop-filter:blur(12px)}
.search{padding:16px 18px;border:1px solid #e0e5dc;border-radius:15px;font-size:15px;background:#fff;box-shadow:0 4px 15px rgba(20,40,30,.035);transition:border-color .2s,box-shadow .2s}
.search:focus{border-color:#8fa996;box-shadow:0 0 0 4px rgba(36,77,61,.09)}
.title{font-size:clamp(22px,3vw,30px);font-weight:850;letter-spacing:-.8px;color:var(--wp-ink);margin:17px 0 20px}
.grid{gap:18px}
.category,.product{border:1px solid rgba(36,77,61,.08);border-radius:18px;background:#fff;box-shadow:var(--wp-shadow);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.category{text-align:left;cursor:pointer}
.category:hover,.product:hover{transform:translateY(-3px);box-shadow:var(--wp-shadow-hover);border-color:rgba(36,77,61,.18)}
.category img,.placeholder{aspect-ratio:1.08;object-fit:cover}
.placeholder{background:linear-gradient(145deg,#f0f2eb,#e5e9df);color:var(--wp-green);font-size:46px}
.info{padding:15px 16px 17px}
.name{font-size:16px;font-weight:800;line-height:1.35;letter-spacing:-.2px;color:var(--wp-ink)}
.count{color:var(--wp-muted);font-size:12px;margin-top:6px;font-weight:600}
.product{overflow:hidden}
.product img{aspect-ratio:1.03;object-fit:contain;padding:10px;background:#fff}
.body{padding:15px 16px 17px}
.desc{color:var(--wp-muted);font-size:13px;line-height:1.55;margin-top:7px}
.price{font-size:21px;font-weight:850;margin-top:10px;color:var(--wp-green)}
.priceChoices{gap:8px;margin-top:13px}
.priceChoice{border:1px solid #dce3da;border-radius:11px;background:#fbfcf9;color:var(--wp-ink);padding:11px 8px;font-size:12px;font-weight:750;transition:all .18s ease}
.priceChoice:hover{border-color:#91a995}
.priceChoice.active{background:var(--wp-green);color:#fff;border-color:var(--wp-green);box-shadow:0 4px 10px rgba(36,77,61,.16)}
.priceChoice small{font-size:15px;font-weight:850;margin-top:5px}
.back{background:var(--wp-green);border-radius:11px;padding:12px 16px;font-size:14px;box-shadow:0 4px 12px rgba(36,77,61,.12);transition:background .2s}
.back:hover,.addbtn:hover{background:var(--wp-green-dark)}
.qtyrow{gap:10px;margin-top:13px}
.qtybtn{width:38px;height:38px;border-radius:11px;background:#edf1eb;color:var(--wp-green);cursor:pointer;transition:background .2s}
.qtybtn:hover{background:#dfe8dc}
.qty{color:var(--wp-ink);font-variant-numeric:tabular-nums}
.addbtn{margin-top:11px;border-radius:11px;padding:13px;background:var(--wp-green);font-size:14px;letter-spacing:.1px;cursor:pointer;transition:background .2s,transform .2s}
.addbtn:active,.cartbar:active{transform:scale(.98)}
.empty{border:1px solid var(--wp-line);box-shadow:var(--wp-shadow);color:var(--wp-muted)}
.cartbar{right:20px;bottom:20px;background:var(--wp-green);border:1px solid rgba(255,255,255,.2);padding:14px 20px;font-size:15px;box-shadow:0 10px 28px rgba(25,58,45,.28);transition:transform .2s,background .2s}
.cartbar:hover{background:var(--wp-green-dark)}
.cartbar span{background:#fff;color:var(--wp-green);margin-left:8px;min-width:25px;display:inline-block;text-align:center}
.cartmodal{background:rgba(13,26,20,.56);backdrop-filter:blur(5px)}
.cartbox{border:1px solid rgba(255,255,255,.7);border-radius:23px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.2)}
.carthead{color:var(--wp-ink);letter-spacing:-.5px}
.closecart{background:#eef1eb;color:var(--wp-ink);cursor:pointer}
.cartitem{border-bottom:1px solid #edf0e9}
.cartitem img{border:1px solid #edf0e9;background:#fafbf8}
.cartname{color:var(--wp-ink);font-size:14px}
.cartprice{color:var(--wp-muted);line-height:1.5}
.remove{cursor:pointer}
.carttotal{color:var(--wp-green);padding-top:4px}
.checkout{gap:8px}
.checkout label{color:#35463c;font-size:13px;margin-top:4px}
.checkout input,.checkout textarea{border:1px solid #dfe5dc;border-radius:11px;background:#fcfdfb;padding:13px;font-size:15px;transition:border-color .2s,box-shadow .2s}
.checkout input:focus,.checkout textarea:focus{outline:none;border-color:#8fa996;box-shadow:0 0 0 3px rgba(36,77,61,.08)}
.locationbtn{border:1px solid #cfdacf;background:#f8faf6;color:var(--wp-green);border-radius:11px;cursor:pointer}
.locationhint{color:var(--wp-muted);line-height:1.45}
.sendwa{background:#218653;border-radius:12px;padding:15px;cursor:pointer;box-shadow:0 5px 15px rgba(33,134,83,.16);transition:filter .2s,transform .2s}
.sendwa:hover{filter:brightness(.96)}
.sendwa:disabled{cursor:wait}
.zoommodal{backdrop-filter:blur(6px)}
.closezoom{cursor:pointer}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid rgba(200,169,107,.8);outline-offset:3px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding-left:28px;padding-right:28px}.toolbar{padding-top:14px}}
@media(max-width:600px){header{padding:11px 14px}.wrap{padding:14px}.site-logo{width:54px;height:54px;border-radius:14px}h1{font-size:22px}.sub{font-size:10px;letter-spacing:1.35px}.toolbar{top:78px;padding:9px 0 13px}.grid{gap:11px}.category,.product{border-radius:15px}.info{padding:11px}.body{padding:11px}.name{font-size:14px}.count{font-size:11px}.priceChoice{font-size:11px;padding:9px 5px}.priceChoice small{font-size:14px}.cartbar{right:14px;bottom:14px;padding:13px 17px}.cartbox{padding:17px;border-radius:20px}.cartmodal{padding:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

</style>
</head>
<body>
<header>
  <div class="wrap brand">
    <img src="logo.png" class="site-logo" alt="White Pack">
    <div>
      <h1 id="business">White Pack</h1>
      <div class="sub">Product Catalogue</div>
    </div>
  </div>
</header>
<main class="wrap">
<div class="toolbar"><input id="search" class="search" autocomplete="off" placeholder="🔍 Search products or categories..."></div>
<section id="categories"><div class="title">Choose a Category</div><div id="categoryGrid" class="grid"></div></section>
<section id="products"><button id="back" class="back">← All Categories</button><div id="categoryTitle" class="title"></div><div id="productGrid" class="grid"></div></section>
</main>
<button id="cartBar" class="cartbar">🛒 Order <span id="cartCount">0</span></button>

<div id="zoomModal" class="zoommodal" aria-hidden="true">
  <button id="closeZoom" class="closezoom" aria-label="Close">×</button>
  <img id="zoomImage" src="" alt="Product image">
</div>

<div id="cartModal" class="cartmodal">
  <div class="cartbox">
    <div class="carthead"><div>🛒 Your Order</div><button id="closeCart" class="closecart">✕</button></div>
    <div id="cartItems"></div>
    <div id="cartTotal" class="carttotal"></div>
    <div class="checkout">
      <label for="customerName">Customer name *</label><input id="customerName" autocomplete="name" maxlength="120" required placeholder="Your full name">
      <label for="customerPhone">Phone number *</label><input id="customerPhone" type="tel" autocomplete="tel" maxlength="40" required placeholder="03 123 456">
      <label for="deliveryAddress">Delivery address</label><textarea id="deliveryAddress" rows="2" maxlength="500" placeholder="Area, street, building, floor"></textarea>
      <button id="shareLocation" type="button" class="locationbtn">📍 Share my delivery location (optional)</button>
      <div id="locationHint" class="locationhint" aria-live="polite">Location is optional. Your browser will ask permission.</div>
      <label for="orderNotes">Order notes (optional)</label><textarea id="orderNotes" rows="2" maxlength="500" placeholder="Delivery instructions"></textarea>
      <div id="orderError" class="ordererror" role="alert"></div>
    </div>
    <button id="sendWhatsApp" class="sendwa">📲 Send Order to WhatsApp</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let products=[],active="",categoryOrder=[];
let cart=[];
const selectedUnits={};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function cats(){
  const actual=[...new Set(products.map(p=>String(p.category||"").trim()).filter(Boolean))];
  // Use the same category order saved by Admin.
  const saved=Array.isArray(categoryOrder)?categoryOrder:[];
  return [...saved.filter(c=>actual.includes(c)), ...actual.filter(c=>!saved.includes(c))];
}
function photo(c){return products.find(p=>String(p.category||"").trim()===c&&p.photo)?.photo||""}

function renderCats(){
 $("categories").style.display="block";$("products").style.display="none";
 const q=$("search").value.toLowerCase().trim();
 const html=cats().map(c=>{
  const items=products.filter(p=>String(p.category||"").trim()===c);
  if(q&&!(`${c} ${items.map(p=>p.name+" "+(p.description||"")).join(" ")}`.toLowerCase().includes(q)))return"";
  const im=photo(c);
  return `<button class="category" data-c="${esc(c)}">${im?`<img src="${esc(im)}" loading="lazy" alt="">`:`<div class="placeholder">📦</div>`}<div class="info"><div class="name">${esc(c)}</div><div class="count">${items.length} product${items.length===1?"":"s"}</div></div></button>`;
 }).join("");
 $("categoryGrid").innerHTML=html||'<div class="empty">No categories found.</div>';
 document.querySelectorAll(".category").forEach(b=>b.onclick=()=>openCat(b.dataset.c));
}

function showCategory(c){
  active=c;
  $("search").value="";
  $("categories").style.display="none";
  $("products").style.display="block";
  $("categoryTitle").textContent=c;
  renderProducts();
  scrollTo(0,0);
}

function showHome(){
  active="";
  $("search").value="";
  renderCats();
  scrollTo(0,0);
}

function openCat(c){
  showCategory(c);
  history.pushState({page:"category",category:c},"","#category="+encodeURIComponent(c));
}

function productKey(p){return String(p.id??p.barcode??p.name??'product');}
function priceOptions(p){
 const out=[];
 const p1=p.price1??p.price;
 if(p1!==undefined&&p1!==null&&String(p1)!=='')out.push({label:p.price1Label||'Box',price:p1,key:'1'});
 if(p.price2!==undefined&&p.price2!==null&&String(p.price2)!=='')out.push({label:p.price2Label||'Packet',price:p.price2,key:'2'});
 return out;
}
function selectedOption(p){const opts=priceOptions(p);if(!opts.length)return {label:'',price:'',key:'1'};return opts.find(o=>o.key===selectedUnits[productKey(p)])||opts[0];}
function selectPrice(i,key){const list=products.filter(p=>String(p.category||'').trim()===active&&`${p.name||''} ${p.description||''}`.toLowerCase().includes($('search').value.toLowerCase().trim()));const p=list[i];if(!p)return;selectedUnits[productKey(p)]=key;renderProducts();}
function renderProducts(){
 const q=$("search").value.toLowerCase().trim();
 const a=products.filter(p=>String(p.category||"").trim()===active&&`${p.name||""} ${p.description||""}`.toLowerCase().includes(q));
 $("productGrid").innerHTML=a.length?a.map((p,i)=>`
 <article class="product">
  <img src="${esc(p.photo||"")}" loading="lazy" alt="${esc(p.name)}" onclick="zoomProduct(this.src,this.alt)">
  <div class="body">
   <div class="name">${esc(p.name)}</div>
   ${p.description?`<div class="desc">${esc(p.description)}</div>`:""}
   ${priceOptions(p).length?`<div class="priceChoices">${priceOptions(p).map(o=>`<button type="button" class="priceChoice ${selectedOption(p).key===o.key?'active':''}" onclick="selectPrice(${i},'${o.key}')">${esc(o.label)}<small>$${esc(String(o.price).replace(/^\$/,''))}</small></button>`).join('')}</div>`:''}
   <div class="qtyrow">
    <button class="qtybtn" onclick="changeQty(${i},-1)">−</button>
    <div class="qty" id="q_${i}">1</div>
    <button class="qtybtn" onclick="changeQty(${i},1)">+</button>
   </div>
   <button class="addbtn" onclick="addToCart(${i})">🛒 Add to Order</button>
  </div>
 </article>`).join(""):'<div class="empty">No products found.</div>';
}

function changeQty(i,n){
 const el=$("q_"+i);
 let q=Math.max(1,(parseInt(el.textContent)||1)+n);
 el.textContent=q;
}

function addToCart(i){
 const q=Math.max(1,parseInt($("q_"+i)?.textContent)||1);
 const list=products.filter(p=>String(p.category||"").trim()===active&&`${p.name||""} ${p.description||""}`.toLowerCase().includes($("search").value.toLowerCase().trim()));
 const p=list[i];
 if(!p)return;
 const option=selectedOption(p);
 const key=productKey(p)+'::'+option.key;
 const found=cart.find(x=>x.key===key);
 if(found)found.qty+=q; else cart.push({key,p,qty:q,unit:option.label,unitKey:option.key,unitPrice:option.price});
 renderCart();
 $("cartBar").animate([{transform:"scale(1)"},{transform:"scale(1.08)"},{transform:"scale(1)"}],{duration:250});
}


function zoomProduct(src,alt="Product image"){
  if(!src)return;
  $("zoomImage").src=src;
  $("zoomImage").alt=alt;
  $("zoomModal").classList.add("open");
  $("zoomModal").setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
}
function closeZoom(){
  $("zoomModal").classList.remove("open");
  $("zoomModal").setAttribute("aria-hidden","true");
  $("zoomImage").src="";
  document.body.style.overflow="";
}
$("closeZoom").onclick=e=>{e.stopPropagation();closeZoom()};
$("zoomModal").onclick=e=>{if(e.target===$("zoomModal"))closeZoom()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeZoom()});

function renderCart(){
 const count=cart.reduce((s,x)=>s+x.qty,0);
 $("cartCount").textContent=count;
 if(!cart.length){
  $("cartItems").innerHTML='<div class="cartempty">Your order is empty.</div>';
  $("cartTotal").textContent="";
  return;
 }
 $("cartItems").innerHTML=cart.map((x,i)=>`
  <div class="cartitem">
   <img src="${esc(x.p.photo||"")}" alt="">
   <div>
    <div class="cartname">${esc(x.p.name)}</div>
    <div class="cartprice">${x.unit?`${esc(x.unit)} · `:''}Quantity: ${x.qty}${x.unitPrice!==undefined&&x.unitPrice!==''?` · $${esc(String(x.unitPrice).replace(/^\$/,''))} each`:''}</div>
   </div>
   <button class="remove" onclick="removeCart(${i})">Remove</button>
  </div>`).join("");
 const total=cart.reduce((s,x)=>s+(parseFloat(String(x.unitPrice??x.p.price??"").replace(/[^0-9.-]/g,""))||0)*x.qty,0);
 $("cartTotal").textContent=total>0?`Total: $${total.toFixed(2)}`:`${count} item${count===1?"":"s"}`;
}

function removeCart(i){cart.splice(i,1);renderCart()}

$("cartBar").onclick=()=>{$("cartModal").classList.add("open");renderCart()};
$("closeCart").onclick=()=>$("cartModal").classList.remove("open");
$("cartModal").onclick=e=>{if(e.target===$("cartModal"))$("cartModal").classList.remove("open")};

// Publishable key only. Never place a secret/service-role key in a public page.
const ordersDb = window.supabase.createClient(
  'https://gaphiedcwueunmfssisz.supabase.co',
  'sb_publishable_XnMvCbQGs2tGHXQa5Cjbew_vTTM7ubG'
);
let deliveryCoords=null;
$("shareLocation").onclick=()=>{
  if(!navigator.geolocation){$("locationHint").textContent="Location is unavailable on this device. Enter your address instead.";return;}
  $("locationHint").textContent="Requesting your permission…";
  navigator.geolocation.getCurrentPosition(pos=>{
    deliveryCoords={lat:pos.coords.latitude,lng:pos.coords.longitude};
    $("locationHint").textContent="✓ Location selected. It will be shared with White Pack when you submit your order.";
  },()=>{$("locationHint").textContent="Location was not shared. You can enter your address instead.";deliveryCoords=null;},
  {enableHighAccuracy:true,timeout:15000,maximumAge:0});
};
const parseMoney=v=>Number.parseFloat(String(v??'').replace(/[^0-9.-]/g,''))||0;
$("sendWhatsApp").onclick=async()=>{
  const error=$("orderError");error.textContent="";
  if(!cart.length){error.textContent="Please add products first.";return;}
  const name=$("customerName").value.trim(),phone=$("customerPhone").value.trim();
  const address=$("deliveryAddress").value.trim(),notes=$("orderNotes").value.trim();
  if(!name||!phone){error.textContent="Please enter your name and phone number.";return;}
  if(!address&&!deliveryCoords){error.textContent="Please enter an address or share your delivery location.";return;}
  const items=cart.map(x=>({id:x.p.id??null,name:x.p.name,unit:x.unit,quantity:x.qty,unit_price:parseMoney(x.unitPrice??x.p.price),line_total:parseMoney(x.unitPrice??x.p.price)*x.qty}));
  const total=items.reduce((sum,x)=>sum+x.line_total,0);
  const btn=$("sendWhatsApp");btn.disabled=true;btn.textContent="Saving order…";
  try{
    const {data,error:dbError}=await ordersDb.rpc('submit_white_pack_order',{
      p_customer_name:name,p_customer_phone:phone,p_delivery_address:address||null,
      p_delivery_lat:deliveryCoords?.lat??null,p_delivery_lng:deliveryCoords?.lng??null,
      p_location_shared:!!deliveryCoords,p_items:items,p_total:total,p_currency:'USD',p_notes:notes||null
    });
    if(dbError)throw dbError;
    const saved=Array.isArray(data)?data[0]:data;
    if(!saved?.order_number)throw new Error('Order was not confirmed by the database. Please contact White Pack.');
    let msg=`Hello White Pack, I placed order #${saved.order_number}:\nCustomer: ${name}\nPhone: ${phone}\n`;
    items.forEach((x,i)=>msg+=`${i+1}. ${x.name} (${x.unit||'Unit'}) × ${x.quantity} — $${x.line_total.toFixed(2)}\n`);
    msg+=`\nTotal: $${total.toFixed(2)}\nAddress: ${address||'GPS location shared'}`;
    if(deliveryCoords)msg+=`\nMap: https://www.google.com/maps?q=${deliveryCoords.lat},${deliveryCoords.lng}`;
    if(notes)msg+=`\nNotes: ${notes}`;
    msg+='\nOrder saved in White Pack system.';
    error.style.color='#166534';error.textContent=`Order #${saved.order_number} saved. Opening WhatsApp…`;
    cart=[];renderCart();
    // On mobile a browser may block popups after an asynchronous request.
    const link='https://wa.me/96181085811?text='+encodeURIComponent(msg);
    window.location.href=link;
  }catch(e){error.style.color='#b91c1c';error.textContent='Could not save your order. Please try again or contact White Pack. '+(e?.message||'');}
  finally{btn.disabled=false;btn.textContent='📲 Save Order & Open WhatsApp';}
};

$("search").oninput=()=>{$("products").style.display==="block"?renderProducts():renderCats()};

$("back").onclick=()=>{
  if(history.state && history.state.page==="category") history.back();
  else showHome();
};

window.addEventListener("popstate",()=>{
  const state=history.state;
  if(state && state.page==="category" && state.category){
    showCategory(state.category);
  }else{
    showHome();
  }
});

renderCart();
fetch("products.json",{cache:"default"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  products=Array.isArray(d)?d:(d.products||[]);
  categoryOrder=Array.isArray(d.categoryOrder)?d.categoryOrder:[];
  $("business").textContent=d.businessName||"White Pack";
  document.title=d.businessName||"Catalogue";
  if(!history.state || history.state.page!=="home"){
    history.replaceState({page:"home"},"",location.pathname+location.search);
  }
  renderCats();
}).catch(()=>{$("categoryGrid").innerHTML='<div class="empty">Catalogue unavailable.<br><br>Make sure <b>products.json</b> is in the same GitHub folder.</div>'});
</script>

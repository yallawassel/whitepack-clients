<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f35"><meta name="description" content="Business product catalogue"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Business Catalogue</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="saas.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:Arial,sans-serif}header{background:var(--brand,#173f35);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px;max-width:1100px;margin:auto}.logo{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:50%}.wrap{max-width:1100px;margin:auto;padding:12px}h1{font-size:23px;margin:0 0 5px;overflow-wrap:anywhere}.sub{font-size:13px;opacity:.85}.toolbar{position:sticky;top:80px;background:#f5f6f8;padding:8px 0;z-index:10}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px}.title{font-size:22px;font-weight:900;margin:13px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.category,.product{background:#fff;border:0;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px #0001;min-width:0}.category{padding:0;text-align:left;cursor:pointer}.category img,.placeholder{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#fff;padding:6px}.placeholder{display:grid;place-items:center;background:#e7ece8;font-size:38px}.info{padding:11px}.name{font-size:16px;font-weight:900;overflow-wrap:anywhere}.count{font-size:12px;color:#667085;margin-top:4px}.back{display:block;width:100%;min-height:46px;border:0;background:var(--brand,#173f35);color:#fff;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.3;font-weight:800;text-align:center;white-space:normal;overflow-wrap:anywhere;margin:4px 0 12px}.product img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;cursor:zoom-in;padding:6px}.body{padding:11px}.desc{font-size:13px;color:#596273;line-height:1.4;margin-top:5px;white-space:pre-wrap}.priceChoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}.priceChoice{border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#111827;padding:8px 5px;font-size:12px;font-weight:800;min-width:0;overflow-wrap:anywhere}.priceChoice.active{background:var(--brand,#173f35);color:#fff}.priceChoice small{display:block;font-size:14px;margin-top:3px}.qtyrow{display:flex;align-items:center;gap:8px;margin-top:10px}.qtybtn{width:36px;height:36px;border:0;border-radius:9px;background:#e5e7eb;font-size:20px;font-weight:900}.qty{min-width:24px;text-align:center;font-weight:900}.addbtn{width:100%;margin-top:9px;border:0;border-radius:10px;padding:11px;background:var(--brand,#173f35);color:#fff;font-weight:900}.empty{text-align:center;padding:35px 15px;color:#667085;background:#fff;border-radius:14px}.cartbar{position:fixed;right:15px;bottom:15px;z-index:40;background:var(--brand,#173f35);color:#fff;border:0;border-radius:999px;padding:13px 18px;font-size:15px;font-weight:900;box-shadow:0 5px 20px #0003}.cartbar span{background:#fff;color:#111827;border-radius:999px;padding:2px 7px;margin-left:5px}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;padding:14px;align-items:flex-end;justify-content:center}.modal.open{display:flex}.box{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:16px}.cartline{display:grid;grid-template-columns:54px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.cartline img{width:54px;height:54px;object-fit:contain}.cartline small{display:block;color:#667085;margin-top:3px}.remove{border:0;background:#fee2e2;color:#991b1b;border-radius:8px;padding:7px}.checkout{display:grid;gap:9px;margin-top:12px}.checkout input,.checkout textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.send{width:100%;padding:13px;border:0;border-radius:11px;background:#16a34a;color:white;font-size:16px;font-weight:900}.close{float:right;border:0;border-radius:8px;padding:8px 11px}.zoom{display:none;position:fixed;inset:0;background:#000e;z-index:100;align-items:center;justify-content:center;padding:16px}.zoom.open{display:flex}.zoom img{max-width:96vw;max-height:90vh;object-fit:contain}.zoom button{position:absolute;right:15px;top:15px;padding:12px;border:0;border-radius:50%}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#17231f;color:#fff;padding:12px 16px;border-radius:11px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
body.template-premium{background:#111827;color:#f9fafb}

footer{text-align:center;padding:25px;color:#667085;font-size:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:390px){.logo{width:46px;height:46px}h1{font-size:20px}.grid{gap:8px}.info,.body{padding:9px}.priceChoices{grid-template-columns:1fr}}
</style></head><body><header><div class="brand"><img id="logo" class="logo" alt="Business logo" hidden><div><h1 id="company">Loading catalogue…</h1><div class="sub" id="subtitle"></div></div></div></header><main class="wrap"><div class="toolbar"><input id="search" class="search" type="search" placeholder="Search products…" aria-label="Search products"></div><div id="categoryView"><div class="title">Browse categories</div><section id="categoryGrid" class="grid"></section></div><div id="productView" hidden><button id="back" class="back" type="button">← Back to all categories</button><div class="title" id="categoryTitle"></div><section id="products" class="grid"></section></div><p id="empty" class="empty">Loading catalogue…</p></main><footer id="footer">Business catalogue</footer><button class="cartbar" id="cartButton">🛒 Cart <span id="cartCount">0</span></button>
<div class="modal" id="cartModal"><div class="box"><button class="close" id="closeCart">✕</button><h2>Your order</h2><div id="cartItems"></div><div style="text-align:right;font-weight:900;font-size:20px;margin:14px 0">Total: <span id="cartTotal">$0.00</span></div><div class="checkout"><label>Your name<input id="customerName" autocomplete="name" required></label><label>Phone number<input id="customerPhone" type="tel" autocomplete="tel" required></label><label>Delivery address<textarea id="address" rows="2" autocomplete="street-address"></textarea></label><button id="shareLocation" class="back" type="button" style="width:100%">📍 Share my delivery location</button><div id="locationHint" class="desc">Location sharing is optional.</div><label>Order notes<textarea id="notes" rows="2" placeholder="Optional details"></textarea></label></div><p id="orderStatus" class="desc"></p><button class="send" id="sendOrder">Send order to WhatsApp</button></div></div><div class="zoom" id="zoom"><button id="closeZoom">✕</button><img id="zoomImg" alt=""></div><div id="toast" class="toast"></div>
<script>
(()=>{const {sb,esc,resolveBusiness,money}=MC;const $=id=>document.getElementById(id);let biz=null,products=[],cart=[],activeCategory='',lat=null,lng=null,selected={};const price=(p,unit)=>{const v=unit===1?p.price1:p.price2;return v===null||v===undefined||String(v).trim()===''?NaN:Number(v)};function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function fmt(v){return money(v,biz?.currency||'USD')}function priced(p){return p.price1!=null||p.price2!=null}function cover(p){return p.price1==null&&p.price2==null}function setBrand(){const appleIcon=document.querySelector('link[rel="apple-touch-icon"]');if(appleIcon&&biz.logo_url)appleIcon.href=biz.logo_url;document.body.classList.remove('template-classic','template-premium','template-fresh');document.body.classList.add('template-'+(['classic','premium','fresh'].includes(biz.catalogue_template)?biz.catalogue_template:'classic'));document.documentElement.style.setProperty('--brand',biz.primary_color||'#173f35');$('company').textContent=biz.company_name;$('subtitle').textContent=biz.description||'';$('footer').textContent=biz.company_name+' · Product catalogue';if(biz.logo_url){$('logo').onerror=()=>{$('logo').hidden=true};$('logo').onload=()=>{$('logo').hidden=false};$('logo').src=biz.logo_url;$('logo').hidden=false}}
function visibleProducts(){const q=$('search').value.toLowerCase().trim();return products.filter(p=>[p.name,p.category,p.description,p.barcode].join(' ').toLowerCase().includes(q))}function renderCategories(){const list=visibleProducts();const cats=[...new Set(list.map(p=>p.category||'Products'))].sort((a,b)=>{const pa=products.filter(p=>(p.category||'Products')===a).reduce((m,p)=>Math.min(m,Number(p.sort_order??999999)),Infinity);const pb=products.filter(p=>(p.category||'Products')===b).reduce((m,p)=>Math.min(m,Number(p.sort_order??999999)),Infinity);return pa-pb||a.localeCompare(b)});$('categoryGrid').innerHTML=cats.map(c=>{const all=products.filter(p=>(p.category||'Products')===c);const coverP=all.find(cover)||all[0];const count=all.filter(priced).length;return `<button class="category" data-category="${esc(c)}">${coverP?.image?`<img loading="lazy" decoding="async" width="600" height="600" src="${esc(coverP.image)}" alt="${esc(c)}">`:`<div class="placeholder">${esc(c.slice(0,1).toUpperCase())}</div>`}<div class="info"><div class="name">${esc(c)}</div><div class="count">${count} product${count===1?'':'s'}</div></div></button>`}).join('');$('empty').hidden=!!cats.length;if(!cats.length)$('empty').textContent='No products match your search.'}
function renderProducts(){const q=$('search').value.toLowerCase().trim();const list=products.filter(p=>(p.category||'Products')===activeCategory&&([p.name,p.category,p.description,p.barcode].join(' ').toLowerCase().includes(q))&&!(cover(p)&&products.filter(x=>(x.category||'Products')===activeCategory)[0]?.id===p.id));$('products').innerHTML=list.map(p=>{const ix=products.findIndex(x=>x.id===p.id);const options=[[p.label1||'Packet',p.price1,1],[p.label2||'Box',p.price2,2]].filter(x=>x[1]!=null);const sel=selected[p.id]||options[0]?.[2]||1;return `<article class="product">${p.image?`<img src="${esc(p.image)}" loading="lazy" decoding="async" width="600" height="600" alt="${esc(p.name)}" data-zoom="${ix}">`:`<div class="placeholder">${esc(p.name.slice(0,1))}</div>`}<div class="body"><div class="name">${esc(p.name)}</div>${p.barcode?`<div class="count">SKU: ${esc(p.barcode)}</div>`:''}${p.description?`<div class="desc">${esc(p.description)}</div>`:''}<div class="priceChoices">${options.map(([label,value,u])=>`<button class="priceChoice ${sel===u?'active':''}" data-unit="${u}" data-id="${p.id}">${esc(label)}<small>${fmt(value)}</small></button>`).join('')}</div><div class="qtyrow"><button class="qtybtn" data-qty="-1" data-id="${p.id}">−</button><span class="qty" id="qty-${p.id}">1</span><button class="qtybtn" data-qty="1" data-id="${p.id}">+</button></div><button class="addbtn" data-add="${p.id}">＋ Add to cart</button></div></article>`}).join('');$('empty').hidden=!!list.length;if(!list.length){$('empty').textContent='No products in this category match your search.';$('empty').hidden=false}}
function showHome(){activeCategory='';$('categoryView').hidden=false;$('productView').hidden=true;$('empty').hidden=products.length>0;renderCategories()}function showCategory(c){activeCategory=c;$('categoryView').hidden=true;$('productView').hidden=false;$('categoryTitle').textContent=c;$('empty').hidden=true;renderProducts()}function openCategory(c){history.pushState({mcView:'category',category:c},'',location.href);showCategory(c)}$('categoryGrid').onclick=e=>{const b=e.target.closest('[data-category]');if(b)openCategory(b.dataset.category)};$('back').onclick=()=>{if(history.state&&history.state.mcView==='category')history.back();else showHome()};window.addEventListener('popstate',e=>{const st=e.state||{};if(st.mcOverlay==='zoom'){$('zoom').classList.remove('open')}if(st.mcOverlay==='cart'){$('cartModal').classList.remove('open')}if(st.mcView==='category'&&st.category)showCategory(st.category);else showHome()});if(!history.state||!history.state.mcView)history.replaceState({mcView:'home'},'',location.href);$('search').oninput=()=>{$('empty').hidden=true;if($('productView').hidden)renderCategories();else renderProducts()};$('products').onclick=e=>{const u=e.target.closest('[data-unit]'),q=e.target.closest('[data-qty]'),a=e.target.closest('[data-add]'),z=e.target.closest('[data-zoom]');if(u){selected[u.dataset.id]=Number(u.dataset.unit);renderProducts()}if(q){const el=$('qty-'+q.dataset.id);el.textContent=Math.max(1,Math.min(999,Number(el.textContent)+Number(q.dataset.qty)))}if(a){const p=products.find(x=>x.id===a.dataset.add);if(!p)return;const unit=selected[p.id]||((p.price1!=null)?1:2),val=price(p,unit);if(!Number.isFinite(val)){toast('This item has no price. Please contact the business.');return}const label=unit===1?(p.label1||'Packet'):(p.label2||'Box'),qty=Number($('qty-'+p.id)?.textContent||1);const existing=cart.find(x=>x.id===p.id&&x.unit===unit);if(existing)existing.qty+=qty;else cart.push({id:p.id,name:p.name,image:p.image,unit,label,price:val,qty});renderCart();toast('✓ '+qty+' item'+(qty===1?'':'s')+' added to cart')}if(z){history.pushState({...history.state,mcOverlay:'zoom'},'',location.href);$('zoomImg').src=products[Number(z.dataset.zoom)].image;$('zoom').classList.add('open')}};
function renderCart(){$('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0);$('cartItems').innerHTML=cart.map((x,i)=>`<div class="cartline">${x.image?`<img src="${esc(x.image)}" alt="">`:'<span>📦</span>'}<div><b>${esc(x.name)}</b><small>${esc(x.label)} · ${fmt(x.price)} × ${x.qty}</small><div style="margin-top:5px"><button class="qtybtn" data-cartqty="-1" data-i="${i}">−</button> <b>${x.qty}</b> <button class="qtybtn" data-cartqty="1" data-i="${i}">+</button></div></div><button class="remove" data-remove="${i}">Remove</button></div>`).join('')||'<div class="empty">Your cart is empty.</div>';$('cartTotal').textContent=fmt(cart.reduce((s,x)=>s+x.qty*x.price,0))}$('cartItems').onclick=e=>{const r=e.target.closest('[data-remove]'),q=e.target.closest('[data-cartqty]');if(r)cart.splice(Number(r.dataset.remove),1);if(q){const x=cart[Number(q.dataset.i)];x.qty+=Number(q.dataset.cartqty);if(x.qty<=0)cart.splice(Number(q.dataset.i),1)}renderCart()};$('cartButton').onclick=()=>{history.pushState({...history.state,mcOverlay:'cart'},'',location.href);$('cartModal').classList.add('open')};$('closeCart').onclick=()=>{if(history.state&&history.state.mcOverlay==='cart')history.back();else $('cartModal').classList.remove('open')};$('cartModal').onclick=e=>{if(e.target===$('cartModal')){if(history.state&&history.state.mcOverlay==='cart')history.back();else $('cartModal').classList.remove('open')}};$('shareLocation').onclick=()=>{if(!navigator.geolocation){$('locationHint').textContent='Location is not supported on this device.';return}$('locationHint').textContent='Requesting location permission…';navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;$('locationHint').textContent='Location added. Accuracy about '+Math.round(p.coords.accuracy)+' m.'},e=>{$('locationHint').textContent='Could not get location. You can still enter the delivery address.'},{enableHighAccuracy:true,timeout:15000})};
$('sendOrder').onclick=async()=>{const name=$('customerName').value.trim(),phone=$('customerPhone').value.trim(),address=$('address').value.trim(),notes=$('notes').value.trim();if(!cart.length){$('orderStatus').textContent='Add at least one priced item first.';return}if(!name||!phone){$('orderStatus').textContent='Enter your name and phone number.';return}const to=String(biz.whatsapp||'').replace(/\D/g,'');if(!to){$('orderStatus').textContent='The business has not configured its WhatsApp number. Please contact the business owner.';return}const waWindow=window.open('about:blank','_blank');if(!waWindow){$('orderStatus').textContent='WhatsApp could not open because pop-ups are blocked. Allow pop-ups for this catalogue and try again.';return}const total=cart.reduce((s,x)=>s+x.qty*x.price,0),items=cart.map(x=>({product_id:x.id,name:x.name,unit:x.label,quantity:x.qty,unit_price:x.price,line_total:x.qty*x.price}));$('sendOrder').disabled=true;$('orderStatus').textContent='Saving order and preparing WhatsApp message…';try{const r=await sb.from('mc_saas_orders').insert({business_id:biz.id,customer_name:name,customer_phone:phone,delivery_address:address,delivery_lat:lat,delivery_lng:lng,location_shared:lat!==null,notes,items,currency:biz.currency||'USD',subtotal:total,total});if(r.error)throw r.error;$('orderStatus').textContent='Order saved. Opening WhatsApp…'}catch(e){$('orderStatus').textContent='Could not save the order online, but you can still send it by WhatsApp. '+(e?.message||'')}const lines=[`Order for ${biz.company_name}`,`Customer: ${name}`,`Phone: ${phone}`,address?`Address: ${address}`:'',lat!==null?`Location: https://www.google.com/maps?q=${lat},${lng}`:'',notes?`Notes: ${notes}`:'','',...cart.map(x=>`${x.name} — ${x.qty} ${x.label} × ${fmt(x.price)} = ${fmt(x.qty*x.price)}`),`TOTAL: ${fmt(total)}`].filter(Boolean);const waUrl='https://wa.me/'+to+'?text='+encodeURIComponent(lines.join('\n'));try{waWindow.location.href=waUrl}catch(e){try{waWindow.close()}catch(_){};$('orderStatus').textContent='Could not open WhatsApp. Allow pop-ups and try again.';$('sendOrder').disabled=false;return}cart=[];renderCart();$('sendOrder').disabled=false};
$('closeZoom').onclick=()=>{if(history.state&&history.state.mcOverlay==='zoom')history.back();else $('zoom').classList.remove('open')};$('zoom').onclick=e=>{if(e.target===$('zoom')){if(history.state&&history.state.mcOverlay==='zoom')history.back();else $('zoom').classList.remove('open')}};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(history.state&&history.state.mcOverlay)history.back();else{$('zoom').classList.remove('open');$('cartModal').classList.remove('open')}}});
(async()=>{try{biz=await resolveBusiness();if(!biz){$('company').textContent='Catalogue unavailable';$('subtitle').textContent='This business catalogue may not be published or the domain may not be configured.';$('empty').textContent='Open the business link supplied by the business owner, or contact the platform administrator.';return}setBrand();const r=await sb.from('mc_saas_products').select('id,business_id,name,category,description,image,barcode,label1,price1,label2,price2,extra_info,sort_order').eq('business_id',biz.id).eq('is_active',true).order('sort_order').order('name');if(r.error)throw r.error;products=r.data||[];renderCategories();$('empty').hidden=products.length>0;if(!products.length)$('empty').textContent='This catalogue has no products yet.'}catch(e){console.error(e);$('empty').textContent='Could not load catalogue. Check the published business, Supabase read policies and internet connection.'}})();
})();
